name: CI
on:
  push:
    branches: [main]
  pull_request:
# The job's token can read the repository and nothing else.
permissions:
  contents: read
# A newer push to a pull request replaces the run of the older one; runs on main each finish. Runs of different
# branches still overlap on the one test database: GitHub keeps a single waiting run per group and cancels the others,
# so one group for every run would leave stacked pull requests without their check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations and e2e both write to this database: stop here if the secret is the production one.
      - name: Refuse the production database
        run: node --input-type=module -e "import('./e2e/test-env.ts').then((m) => m.assertTestDatabase(process.env.DATABASE_URL))"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Signs the sessions of this run's test servers and nothing else: made here, never a stored secret, so a leak
      # of the workflow's secrets cannot mint a session anywhere.
      - name: Make a throwaway auth secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run e2e
        env:
          CI: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Also when the run passed: a test that needed its retry leaves the trace of the attempt that failed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
